name: Publish @run402/nwc

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump kind
        required: true
        default: patch
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      tag:
        description: npm dist-tag
        default: latest
        required: true
      dry_run:
        description: Dry run (build + smoke test only; no publish, no commit, no tag)
        type: boolean
        default: false

concurrency:
  group: publish-nwc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Bump, smoke, publish, tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write
      id-token: write

    # Dispatch inputs reach shell steps through env, never by ${{ }}
    # interpolation into a script.
    env:
      BUMP: ${{ inputs.bump }}
      NPM_DIST_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify npm has OIDC publish support
        run: |
          NPM_VER=$(npm --version)
          echo "npm version: $NPM_VER"
          node -e "const [a,b,c] = process.argv[1].split('.').map(Number); if (a < 11 || (a === 11 && b < 5) || (a === 11 && b === 5 && c < 1)) { console.error('npm '+process.argv[1]+' lacks OIDC trusted-publisher exchange (needs 11.5.1+)'); process.exit(1); }" "$NPM_VER"

      - name: Configure git for commit + push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run build
          npm test

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          cd packages/nwc
          CUR=$(node -p "require('./package.json').version")
          if [ "$BUMP" != "none" ]; then
            npm version "$BUMP" --no-git-tag-version >/dev/null
          fi
          NEW=$(node -p "require('./package.json').version")
          echo "Bumping @run402/nwc: $CUR -> $NEW"
          echo "old=$CUR" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Sync lockfile to reflect new version
        run: |
          if [ "$BUMP" = "none" ]; then
            echo "Package version already committed; lockfile sync skipped."
          else
            npm install --package-lock-only
          fi

      - name: Tarball smoke test
        run: npm run test:nwc:smoke

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          publish_idempotent() {
            local label="$1"
            local attempt=0
            local out
            while [ "$attempt" -lt 3 ]; do
              attempt=$((attempt + 1))
              if out=$(npm publish -w packages/nwc --access public --provenance --tag "$NPM_DIST_TAG" 2>&1); then
                echo "$out"
                echo "[$label] published (attempt $attempt)"
                return 0
              fi
              echo "$out"
              if echo "$out" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT"; then
                echo "[$label] already published at this version - idempotent skip."
                return 0
              fi
              if echo "$out" | grep -qiE "TLOG_CREATE_ENTRY_ERROR|rekor\.sigstore\.dev|tlog entry|ETIMEDOUT|ECONNRESET|socket hang up|aborted"; then
                echo "[$label] transient provenance/network error - retry $attempt/3"
                sleep 10
                continue
              fi
              echo "[$label] non-retryable publish error."
              return 1
            done
            echo "[$label] exhausted retries."
            return 1
          }
          publish_idempotent "@run402/nwc"

      - name: Commit version bump
        if: ${{ !inputs.dry_run && inputs.bump != 'none' }}
        run: |
          set -euo pipefail
          NEW="${{ steps.bump.outputs.new }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            npm version "$NEW" -w packages/nwc --no-git-tag-version --allow-same-version >/dev/null
            npm install --package-lock-only >/dev/null
            git add packages/nwc/package.json package-lock.json
            if git diff --cached --quiet; then
              echo "main is already at @run402/nwc v$NEW - nothing to commit."
              break
            fi
            git commit -m "chore(nwc): bump @run402/nwc to v$NEW"
            if git push origin HEAD:main; then
              echo "Pushed @run402/nwc v$NEW bump on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Could not push the @run402/nwc v$NEW bump to main after 5 attempts."
              exit 1
            fi
            echo "Push rejected; rebuilding on fresh main and retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done

      - name: Tag and push
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          NEW="${{ steps.bump.outputs.new }}"
          TAG="v$NEW-nwc"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.bump.outputs.new }}-nwc
          name: '@run402/nwc v${{ steps.bump.outputs.new }}'
          generate_release_notes: true
          target_commitish: main

      - name: Summary
        run: |
          NEW="${{ steps.bump.outputs.new }}"
          OLD="${{ steps.bump.outputs.old }}"
          DRY="$DRY_RUN"
          {
            echo "## @run402/nwc publish summary"
            echo ""
            echo "- **Bump:** \`$BUMP\` ($OLD -> $NEW)"
            echo "- **npm dist-tag:** \`$NPM_DIST_TAG\`"
            echo "- **Dry run:** $DRY"
            if [ "$DRY" = "true" ]; then
              echo ""
              echo "_Dry run - no publish, no commit, no tag was made._"
            else
              echo "- **npm:** https://www.npmjs.com/package/@run402/nwc/v/$NEW"
              echo "- **Tag:** \`v$NEW-nwc\`"
              echo "- **Provenance attestation:** auto-generated via OIDC"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
